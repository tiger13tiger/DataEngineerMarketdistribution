name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate snapshot data
        run: python scripts/validate_data.py

      - name: Build site (dry run)
        run: bash scripts/build_site.sh dist_check preview
